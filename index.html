<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal</title>

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#ffffff">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <iframe
        src="https://script.google.com/macros/s/AKfycbw8TgE-Afn5AH30kLRM76W0e4gK_oOM9wljZU76oIosrYa6ccytcNWdeiAUIv6NNPc3tw/exec"
        allow="fullscreen">
    </iframe>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js")
                    .then(() => console.log("Service Worker aktif"))
                    .catch(error => console.error("Service Worker gagal:", error));
            });
        }
    </script>

</body>
</html>
